<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fri3nds Drive | Recuperar contraseña</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="fondo-ambiental" aria-hidden="true">
        <span class="orbe orbe-a"></span>
        <span class="orbe orbe-b"></span>
        <span class="rejilla"></span>
    </div>

    <nav class="navbar">
        <div class="navbar-inner">
            <a class="logo" href="index.html">
                <span class="logo-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.5 19a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.1 9.4 3.8 3.8 0 0 0 6.5 19z"/>
                        <path d="M12 12v5"/><path d="M9.5 14.5 12 17l2.5-2.5"/>
                    </svg>
                </span>
                <span class="logo-texto">Fri3nds <b>Drive</b></span>
            </a>
            <div class="nav-text">Recuperación de cuenta</div>
        </div>
    </nav>

    <main class="form-page">
        <section class="form-card">

            <span class="eyebrow">Recuperación</span>
            <h2>Recuperar contraseña</h2>
            <p class="form-description">
                Escribe tu correo para generar un código temporal y crear una contraseña nueva.
            </p>

            <!-- Paso 1: solicitar código -->
            <div class="bloque-paso">
                <span class="paso-etiqueta">Solicitar código</span>

                <div class="campo">
                    <label for="correoRecuperacion">Correo electrónico</label>
                    <input type="email" id="correoRecuperacion" placeholder="nombre@correo.com" autocomplete="email">
                </div>

                <button class="btn btn-primario" onclick="solicitarRecuperacion()">Solicitar código</button>

                <!-- app.js muestra aquí el código temporal si el backend lo devuelve -->
                <div id="codigoBox" class="codigo-box"></div>
            </div>

            <!-- Paso 2: cambiar contraseña -->
            <div class="bloque-paso">
                <span class="paso-etiqueta">Cambiar contraseña</span>

                <div class="campo">
                    <label for="codigoRecuperacion">Código de recuperación</label>
                    <input type="text" id="codigoRecuperacion" placeholder="Código recibido">
                </div>

                <div class="campo">
                    <label for="nuevaPassword">Nueva contraseña</label>
                    <input type="password" id="nuevaPassword" placeholder="••••••••" autocomplete="new-password">
                </div>

                <div class="campo">
                    <label for="confirmarNuevaPassword">Confirmar nueva contraseña</label>
                    <input type="password" id="confirmarNuevaPassword" placeholder="••••••••" autocomplete="new-password">
                </div>

                <button class="btn btn-primario" onclick="restablecerPassword()">Cambiar contraseña</button>
            </div>

            <button class="btn btn-secundario" onclick="window.close()">Cerrar pestaña</button>

            <!-- app.js escribe aquí los mensajes del proceso -->
            <p class="mensaje" id="mensajeRecuperacion"></p>

        </section>
    </main>

    <div id="toastZona" class="toast-zona" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
